<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:56px;padding:0 20px;background:#050505;border-top:1px solid #262626;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'Instrument Sans',sans-serif;color:#F2F0EB;">
  <span style="font-size:15px;letter-spacing:0.01em;line-height:22px;font-variant-numeric:tabular-nums;color:#A6A6A6;">{{ today }}</span>
  <a href="{{ href }}" style="flex:none;display:inline-flex;align-items:center;height:48px;padding:0 24px;background:#F2F0EB;color:#0A0A0A;font-size:15px;line-height:20px;font-weight:500;letter-spacing:0.01em;text-decoration:none;" style-hover="background:#A6A6A6;color:#0A0A0A;">{{ label }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;56px&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a table&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const today = 'Kalendegatan 12, open 17:00–00:00';
    return {
      today,
      label: this.props.label || 'Book a table',
      href: this.props.href || '#',
    };
  }
}
</script>
</body>
</html>
