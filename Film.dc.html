<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:#050505;">
  <video ref="{{ videoRef }}" src="{{ src }}" poster="{{ poster }}" aria-label="{{ caption }}" muted="{{ true }}" loop="{{ false }}" playsInline="{{ true }}" preload="{{ preload }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ position }};display:block;"></video>
  <sc-if value="{{ restPoster }}" hint-placeholder-val="{{ false }}">
    <img src="{{ poster }}" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ position }};display:block;pointer-events:none;opacity:{{ restOpacity }};transition:{{ restTransition }};">
  </sc-if>
  <sc-if value="{{ textScrim }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(5,5,5,0.45);"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to bottom, rgba(5,5,5,0) 0%, rgba(5,5,5,0.8) 100%);"></div>
  </sc-if>
  <sc-if value="{{ topScrim }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:0;height:160px;background:linear-gradient(to bottom, rgba(10,10,10,0.6) 0%, rgba(10,10,10,0) 100%);"></div>
  </sc-if>
  <sc-if value="{{ heroDesk }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(5,5,5,0.12);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(5,5,5,0) 48%, rgba(5,5,5,0.6) 74%, rgba(5,5,5,0.9) 100%);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to right, rgba(5,5,5,0.5) 0%, rgba(5,5,5,0) 55%);"></div>
    <div style="position:absolute;left:0;right:0;top:0;height:160px;background:linear-gradient(to bottom, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0) 100%);"></div>
  </sc-if>
  <sc-if value="{{ heroMob }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(5,5,5,0.12);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(5,5,5,0) 42%, rgba(5,5,5,0.7) 62%, rgba(5,5,5,0.92) 100%);"></div>
    <div style="position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(to bottom, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0) 100%);"></div>
  </sc-if>
  <sc-if value="{{ hero }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ toggle }}" aria-label="{{ label }}" title="{{ label }}" style="position:absolute;right:16px;bottom:16px;z-index:2;width:44px;height:44px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.7;transition:opacity 150ms;" style-hover="opacity:1;" style-focus="opacity:1;outline:2px solid #F2F0EB;outline-offset:-2px;">
      <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
        <svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true" style="display:block;"><line x1="4" y1="2" x2="4" y2="10" stroke="#F2F0EB" stroke-width="1"></line><line x1="8" y1="2" x2="8" y2="10" stroke="#F2F0EB" stroke-width="1"></line></svg>
      </sc-if>
      <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
        <svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true" style="display:block;"><path d="M4 2 L10 6 L4 10 Z" fill="none" stroke="#F2F0EB" stroke-width="1" stroke-linejoin="round"></path></svg>
      </sc-if>
    </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;960px&quot;,&quot;height&quot;:&quot;540px&quot;},&quot;film&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;v1_hero&quot;,&quot;v2_table_bookings&quot;,&quot;v3_unexpected_surprises&quot;,&quot;v4_award_flavours&quot;,&quot;v5_header_menu_events&quot;],&quot;default&quot;:&quot;v1_hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hero&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;position&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;50% 50%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startAt&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;loopEnd&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;lazy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { playing: false, rest: false };
  segs() {
    const raw = this.props.segments; if (!raw) return null;
    const out = String(raw).split(',').map(p => p.split('-').map(Number)).filter(p => p.length === 2 && p.every(n => !isNaN(n)));
    return out.length ? out : null;
  }
  videoRef = React.createRef();
  area = 0;
  userPaused = false;
  armed = true;
  static reg() {
    if (!window.__occoHeroes) window.__occoHeroes = new Set();
    return window.__occoHeroes;
  }
  static reduced() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  static pick() {
    let best = null;
    const heroes = [...Component.reg()];
    heroes.forEach(f => { if (f.area > 0 && !f.userPaused && (!best || f.area > best.area)) best = f; });
    if (Component.reduced()) best = null;
    heroes.forEach(f => (f === best ? f.play() : f.pause()));
  }
  isHero() { return !!this.props.hero; }
  play() {
    const v = this.videoRef.current; if (!v) return;
    v.muted = true;
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    if (!this.state.playing) this.setState({ playing: true });
  }
  pause() {
    const v = this.videoRef.current; if (v && !v.paused) v.pause();
    if (this.state.playing) this.setState({ playing: false });
  }
  playMoment() {
    const v = this.videoRef.current; if (!v || Component.reduced()) return;
    const start = Number(this.props.startAt) || 0;
    if (this.state.rest) this.setState({ rest: false });
    const go = () => { try { v.currentTime = start; } catch (e) {} this.play(); };
    if (v.readyState >= 1) go(); else { v.preload = 'auto'; v.addEventListener('loadedmetadata', go, { once: true }); v.load(); }
  }
  componentDidMount() {
    const v = this.videoRef.current; if (!v) return;
    v.muted = true;
    const segs = this.segs();
    const start = segs ? segs[0][0] : (Number(this.props.startAt) || 0);
    const end = Number(this.props.loopEnd) || 0;
    const hero = this.isHero();
    if (hero && segs) {
      // play only the listed segments, in order, and loop; nothing between them is ever shown
      this.segI = 0;
      const seekStart = () => { try { v.currentTime = segs[0][0]; } catch (e) {} };
      if (v.readyState >= 1) seekStart(); else v.addEventListener('loadedmetadata', seekStart, { once: true });
      const guard = () => {
        const t = v.currentTime, cur = segs[this.segI];
        if (t >= cur[1] - 0.06 || t < cur[0] - 0.3) {
          if (t >= cur[1] - 0.06) this.segI = (this.segI + 1) % segs.length;
          try { v.currentTime = segs[this.segI][0]; } catch (e) {}
        }
      };
      this.onTime = guard;
      this.onEnded = () => { this.segI = 0; v.currentTime = segs[0][0]; this.play(); };
      const tick = () => { if (!v.paused) guard(); this.raf = requestAnimationFrame(tick); };
      this.raf = requestAnimationFrame(tick);
      Component.reg().add(this);
    } else if (hero) {
      const seekStart = () => { if (start) try { v.currentTime = start; } catch (e) {} };
      if (v.readyState >= 1) seekStart(); else v.addEventListener('loadedmetadata', seekStart, { once: true });
      this.onTime = () => { if ((end && v.currentTime >= end) || (start && v.currentTime < start - 0.5)) v.currentTime = start; };
      this.onEnded = () => { v.currentTime = start; this.play(); };
      Component.reg().add(this);
    } else {
      const finish = () => { this.pause(); if (this.props.restPoster && !this.state.rest) this.setState({ rest: true }); };
      this.onTime = () => { if (end && v.currentTime >= end - 0.08) finish(); };
      this.onEnded = finish;
      // frame-accurate stop so nothing past loopEnd (e.g. the DJ in v3) is ever shown
      if (end) {
        const tick = () => {
          if (!v.paused && v.currentTime >= end - 0.08) finish();
          this.raf = requestAnimationFrame(tick);
        };
        this.raf = requestAnimationFrame(tick);
      }
    }
    v.addEventListener('timeupdate', this.onTime);
    v.addEventListener('ended', this.onEnded);
    this.io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        this.area = e.isIntersecting ? e.intersectionRect.width * e.intersectionRect.height : 0;
        if (!hero) {
          if (e.intersectionRatio >= 0.5 && this.armed) { this.armed = false; this.playMoment(); }
          if (!e.isIntersecting) { this.armed = true; this.pause(); }
        }
      });
      if (hero) Component.pick();
    }, { threshold: [0, 0.1, 0.3, 0.5, 0.7, 0.9, 1] });
    this.io.observe(v);
  }
  componentWillUnmount() {
    this.io && this.io.disconnect();
    if (this.raf) cancelAnimationFrame(this.raf);
    Component.reg().delete(this);
    const v = this.videoRef.current;
    if (v) { v.removeEventListener('timeupdate', this.onTime); v.removeEventListener('ended', this.onEnded); }
  }
  toggle = () => {
    if (this.state.playing) { this.userPaused = true; this.pause(); }
    else { this.userPaused = false; this.play(); }
  };
  renderVals() {
    const film = this.props.film || 'v1_hero';
    const playing = this.state.playing;
    const hero = this.isHero();
    return {
      videoRef: this.videoRef,
      src: (window.__resources && window.__resources[film + '_mp4']) || 'assets/' + film + '_1080p.mp4',
      poster: this.props.posterSrc || (window.__resources && window.__resources[film + '_poster']) || 'assets/' + film + '_poster.jpg',
      topScrim: this.props.scrim === 'top',
      restPoster: !!this.props.restPoster,
      restOpacity: this.state.rest ? 1 : 0,
      restTransition: this.state.rest ? 'opacity 400ms ease' : 'none',
      preload: this.props.lazy ? 'none' : 'metadata',
      position: this.props.position || '50% 50%',
      caption: this.props.caption || '',
      textScrim: !hero && this.props.scrim === 'text',
      hero,
      heroDesk: this.props.hero === 'desktop',
      heroMob: this.props.hero === 'mobile',
      label: playing ? 'Pause film' : 'Play film',
      playing: !!playing,
      paused: !playing,
      toggle: this.toggle,
    };
  }
}
</script>
</body>
</html>
